services:
  postgres:
    image: postgres:14
    container_name: lunaroja_db
    restart: always
    network_mode: host
    environment:
      POSTGRES_USER: lunaroja
      POSTGRES_PASSWORD: lunaroja123
      POSTGRES_DB: lunaroja
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunaroja -d lunaroja"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: lunaroja_pgadmin
    restart: always
    network_mode: host
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lunaroja.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: lunaroja_backend
    network_mode: host
    env_file:
      - .env   # carga EMAIL_PASS, JWT_SECRET, etc.
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: lunaroja
      DB_PASSWORD: lunaroja123
      DB_NAME: lunaroja
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: lunaroja_frontend
    hostname: localhost          # <--- línea añadida
    network_mode: host
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

  metabase:
    image: metabase/metabase:latest
    container_name: lunaroja_metabase
    network_mode: host
    restart: always
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: lunaroja
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_read
      MB_DB_PASS: metabase_read_pw
      MB_DB_HOST: localhost
      MB_JETTY_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data

volumes:
  postgres_data:
    name: lunaroja_postgres_data
  uploads_data:
    name: lunaroja_uploads_data
  metabase_data:
    name: lunaroja_metabase_data