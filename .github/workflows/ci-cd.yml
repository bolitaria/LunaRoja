name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: lunaroja
          POSTGRES_PASSWORD: lunaroja123
          POSTGRES_DB: lunaroja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "No lint script configured"

      # Crear la tabla SequelizeMeta antes de las migraciones
      - name: Initialize SequelizeMeta table (backend)
        if: matrix.service == 'backend'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=lunaroja123 psql -h localhost -U lunaroja -d lunaroja -c "CREATE TABLE IF NOT EXISTS \"SequelizeMeta\" (name VARCHAR(255) NOT NULL PRIMARY KEY);"

      # Ejecutar migraciones
      - name: Run database migrations (backend)
        if: matrix.service == 'backend'
        run: npm run migrate
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret

      # Crear directorios de uploads necesarios para los tests del backend
      - name: Create upload directories for backend tests
        if: matrix.service == 'backend'
        run: |
          sudo mkdir -p /app/uploads/petitions /app/uploads/campaigns /app/uploads/actions /app/uploads/documents /app/uploads/featured
          sudo chmod -R 777 /app/uploads

      - name: Test backend (integration)
        if: matrix.service == 'backend'
        run: npm run test:integration
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret
          API_URL: http://localhost:5000/api
          BASE_URL: http://localhost:5000
          SKIP_DB_SYNC: 'true'   # ← evita el sync de Sequelize

      - name: Test frontend
        if: matrix.service == 'frontend'
        run: npm test

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  scan-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Run Trivy on ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'