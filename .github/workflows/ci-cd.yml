name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: lunaroja
          POSTGRES_PASSWORD: lunaroja123
          POSTGRES_DB: lunaroja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint || echo "No lint script configured"
      # ─── BACKEND SPECIFIC STEPS ───
      - name: Initialize SequelizeMeta table
        if: matrix.service == 'backend'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=lunaroja123 psql -h localhost -U lunaroja -d lunaroja -c "CREATE TABLE IF NOT EXISTS \"SequelizeMeta\" (name VARCHAR(255) NOT NULL PRIMARY KEY);"
      - name: Run database migrations
        if: matrix.service == 'backend'
        run: npm run migrate
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret
      - name: Add missing columns
        if: matrix.service == 'backend'
        run: node scripts/add-missing-columns.js
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
      - name: Create upload directories
        if: matrix.service == 'backend'
        run: mkdir -p uploads/petitions uploads/campaigns uploads/actions uploads/documents uploads/featured
      - name: Seed admin user
        if: matrix.service == 'backend'
        run: |
          node -e "
          const bcrypt = require('bcryptjs');
          const { User } = require('./src/models');
          (async () => {
            const hash = await bcrypt.hash(process.env.ADMIN_PASSWORD, 10);
            await User.upsert({
              username: 'admin',
              email: 'admin@test.com',
              password: hash,
              role: 'superadmin',
              active: true
            });
            console.log('Admin user seeded');
            process.exit();
          })();
          "
        env:
          NODE_ENV: test
          ADMIN_PASSWORD: admin123
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
      - name: Start backend server (with health check)
        if: matrix.service == 'backend'
        run: |
          sudo mkdir -p /app/uploads && sudo chmod 777 /app/uploads
          node src/app.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Backend ready"
              break
            fi
            sleep 2
          done
          if ! curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
            echo "❌ Backend no arrancó. Últimas líneas del log:"
            tail -n 50 /tmp/server.log
            exit 1
          fi
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret
          SKIP_DB_SYNC: 'true'
          ADMIN_PASSWORD: admin123
      - name: Unlock admin account & run integration tests
        if: matrix.service == 'backend'
        run: |
          node -e "
          const { User } = require('./src/models');
          (async () => {
            await User.update(
              { failedLoginAttempts: 0, lockedUntil: null },
              { where: { username: 'admin' } }
            );
            console.log('Admin unlocked');
            process.exit();
          })();
          "
          npm run test:integration -- --runInBand
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret
          API_URL: http://localhost:5000
          BASE_URL: http://localhost:5000
          SKIP_DB_SYNC: 'true'
          ADMIN_PASSWORD: admin123
      # ─── FRONTEND SPECIFIC STEPS ───
      - name: Run frontend unit tests
        if: matrix.service == 'frontend'
        run: npm test
      - name: Build frontend (compilation check)
        if: matrix.service == 'frontend'
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

  e2e-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: lunaroja
          POSTGRES_PASSWORD: lunaroja123
          POSTGRES_DB: lunaroja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Setup database, seed admin, start backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret
          NODE_ENV: test
          SKIP_DB_SYNC: 'true'
          ADMIN_PASSWORD: admin123
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -c "CREATE TABLE IF NOT EXISTS \"SequelizeMeta\" (name VARCHAR(255) NOT NULL PRIMARY KEY);"
          cd backend
          npm run migrate
          node scripts/add-missing-columns.js
          node -e "
          const bcrypt = require('bcryptjs');
          const { User } = require('./src/models');
          (async () => {
            const hash = await bcrypt.hash(process.env.ADMIN_PASSWORD, 10);
            await User.upsert({
              username: 'admin',
              email: 'admin@test.com',
              password: hash,
              role: 'superadmin',
              active: true
            });
            console.log('Admin seeded');
            process.exit();
          })();
          "
          sudo mkdir -p /app/uploads && sudo chmod 777 /app/uploads
          node src/app.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Backend ready"
              break
            fi
            sleep 2
          done
          if ! curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
            echo "❌ Backend no arrancó. Últimas líneas del log:"
            tail -n 50 /tmp/server.log
            exit 1
          fi
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          NEXT_PUBLIC_API_URL=http://localhost:5000 \
          NEXT_PUBLIC_BASE_URL=http://localhost:3000 \
          npm run build
      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
        env:
          CYPRESS_baseUrl: http://localhost:3000
          CYPRESS_admin_username: admin
          CYPRESS_admin_password: admin123
          NEXT_PUBLIC_API_URL: http://localhost:5000

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize owner and repo to lowercase
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LC=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/${{ env.REPO_LC }}:${{ matrix.service }}-${{ github.sha }}

  scan-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Normalize owner and repo to lowercase
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LC=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull ${{ matrix.service }} image
        run: docker pull ghcr.io/${{ env.OWNER_LC }}/${{ env.REPO_LC }}:${{ matrix.service }}-${{ github.sha }}
      - name: Run Trivy on ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/${{ env.REPO_LC }}:${{ matrix.service }}-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'








  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create root .env for docker compose
        run: |
          cat > .env << ENDOFFILE
          POSTGRES_USER=lunaroja
          POSTGRES_PASSWORD=lunaroja123
          POSTGRES_DB=lunaroja
          PGADMIN_DEFAULT_PASSWORD=admin
          BACKEND_DB_USER=lunaroja
          BACKEND_DB_PASSWORD=lunaroja123
          BACKEND_DB_NAME=lunaroja
          ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASS || 'admin123' }}
          ENDOFFILE

      - name: Create backend/.env
        run: |
          mkdir -p backend
          cat > backend/.env << ENDOFFILE
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=lunaroja
          DB_PASSWORD=lunaroja123
          DB_NAME=lunaroja
          JWT_SECRET=${{ secrets.JWT_SECRET || 'dev-secret' }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET || 'dev-refresh-secret' }}
          EMAIL_HOST=mailhog
          EMAIL_PORT=1025
          EMAIL_USER=
          EMAIL_PASS=
          EMAIL_FROM=test@lunaroja.local
          FRONTEND_URL=http://localhost:3000
          CORS_ORIGINS=http://localhost:3000
          ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASS || 'admin123' }}
          ENDOFFILE

      - name: Clean previous Docker resources
        run: docker compose down -v --remove-orphans || true

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5000/api/health > /dev/null; then
              echo "Backend is up"
              break
            fi
            sleep 2
          done

      - name: Wait for login API (DB ready)
        run: |
          for i in {1..30}; do
            if curl -s -X POST http://127.0.0.1:5000/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"admin","password":"admin123"}' | grep -q "token"; then
              echo "Login API ready"
              break
            fi
            sleep 2
          done

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Frontend is up"
              break
            fi
            sleep 2
          done

      - name: Verify backend stability before tests
        run: |
          echo "=== Docker container status ==="
          docker ps -a | grep lunaroja_backend
          echo "=== Backend logs (last 50 lines) ==="
          docker logs lunaroja_backend --tail 50 || true
          echo "=== Health check loop ==="
          for i in {1..10}; do
            if curl -s http://127.0.0.1:5000/api/health > /dev/null; then
              echo "Backend still alive at attempt $i"
            else
              echo "Backend NOT responding at attempt $i"
              docker logs lunaroja_backend --tail 20
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright tests
        env:
          TEST_ADMIN_USER: ${{ secrets.TEST_ADMIN_USER || 'admin' }}
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS || 'admin123' }}
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
