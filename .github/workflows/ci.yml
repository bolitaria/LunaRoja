name: CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: lunaroja
          POSTGRES_PASSWORD: lunaroja123
          POSTGRES_DB: lunaroja
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret
      - run: npm ci && npm test
        working-directory: frontend

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose build backend frontend
      - run: docker compose push backend frontend   # si usas ghcr.io