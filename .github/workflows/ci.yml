name: CI/CD Pipeline – Voces Palestinas

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-security:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: lunaroja
          POSTGRES_PASSWORD: lunaroja123
          POSTGRES_DB: lunaroja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # SHA concreto

      - name: Configurar Node.js
        uses: actions/setup-node@cd39128f88bda8d3b3f1f4b8db9d8c8e1b0e0e0f  # SHA de v4.1.0

      # Backend
      - name: Instalar dependencias backend
        run: cd backend && npm ci

      - name: Iniciar backend
        run: cd backend && npm start & sleep 5

      # Frontend
      - name: Instalar dependencias frontend
        run: cd frontend && npm ci

      - name: Construir frontend
        run: cd frontend && npm run build

      - name: Iniciar frontend
        run: cd frontend && npm start & sleep 5

      # Tests
      - name: Tests unitarios
        run: cd backend && npm run test:auth || true

      - name: Tests de integración
        run: ./full_test.sh || true

      # Seguridad
      - name: Semgrep
        run: |
          docker run -v "${{ github.workspace }}:/src" --rm \
            -e SEMGREP_SEND_METRICS=off \
            semgrep/semgrep:latest \
            semgrep scan --config=p/owasp-top-ten --config=p/secrets --config=p/dockerfile --config=p/docker-compose \
              --config=p/javascript --config=p/typescript --config=p/react --config=p/xss --config=p/security-audit \
              --error /src

      - name: Auditoría dependencias backend
        run: cd backend && npm audit --audit-level=high || true

      - name: Auditoría dependencias frontend
        run: cd frontend && npm audit --audit-level=high || true

      - name: Construir imagen Docker
        run: docker build -t lunaroja_backend ./backend

      - name: Escanear imagen con Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image lunaroja_backend \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress --exit-code 1