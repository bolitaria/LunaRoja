services:
  postgres:
    image: postgres:14
    container_name: lunaroja_db
    restart: always
    environment:
      POSTGRES_USER: lunaroja
      POSTGRES_PASSWORD: lunaroja123
      POSTGRES_DB: lunaroja
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: lunaroja_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lunaroja.org
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: lunaroja_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: lunaroja
      DB_PASSWORD: lunaroja123
      DB_NAME: lunaroja
      JWT_SECRET: supersecretkey
    depends_on:
      - postgres
  frontend:
    build: ./frontend
    container_name: lunaroja_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend