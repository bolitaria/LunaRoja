name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  # ... (el resto del archivo se mantiene igual, solo toca el job e2e-test)

  e2e-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: lunaroja
          POSTGRES_PASSWORD: lunaroja123
          POSTGRES_DB: lunaroja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Setup database, seed admin, start backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret
          NODE_ENV: test
          SKIP_DB_SYNC: 'true'
          ADMIN_PASSWORD: admin123
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -c "CREATE TABLE IF NOT EXISTS \"SequelizeMeta\" (name VARCHAR(255) NOT NULL PRIMARY KEY);"
          cd backend
          npm run migrate
          node scripts/add-missing-columns.js
          node -e "
          const bcrypt = require('bcryptjs');
          const { User } = require('./src/models');
          (async () => {
            const hash = await bcrypt.hash(process.env.ADMIN_PASSWORD, 10);
            await User.upsert({
              username: 'admin',
              email: 'admin@test.com',
              password: hash,
              role: 'superadmin',
              active: true
            });
            console.log('Admin seeded');
            process.exit();
          })();
          "
          sudo mkdir -p /app/uploads && sudo chmod 777 /app/uploads
          node src/app.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Backend ready"
              break
            fi
            sleep 2
          done
          if ! curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
            echo "❌ Backend no arrancó. Últimas líneas del log:"
            tail -n 50 /tmp/server.log
            exit 1
          fi
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          NEXT_PUBLIC_API_URL=http://localhost:5000 \
          NEXT_PUBLIC_BASE_URL=http://localhost:3000 \
          npm run build
      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
        env:
          CYPRESS_baseUrl: http://localhost:3000
          CYPRESS_admin_username: admin
          CYPRESS_admin_password: admin123
          NEXT_PUBLIC_API_URL: http://localhost:5000   # Necesario para que el frontend llame al backend correcto
