services:
  postgres:
    image: postgres:14
    container_name: lunaroja_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lunaroja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lunaroja123}
      POSTGRES_DB: ${POSTGRES_DB:-lunaroja}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunaroja"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - lunaroja_network

  redis:
    image: redis:7-alpine
    container_name: lunaroja_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - lunaroja_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: lunaroja_pgadmin
    restart: always
    ports:
      - "5050:5050"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lunaroja.org
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    depends_on:
      - postgres
    networks:
      - lunaroja_network

  backend:
    build: ./backend
    container_name: lunaroja_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      SKIP_EMAILS: "true"
      SKIP_DB_SYNC: "true"
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${BACKEND_DB_USER:-lunaroja}
      DB_PASSWORD: ${BACKEND_DB_PASSWORD:-lunaroja123}
      DB_NAME: ${BACKEND_DB_NAME:-lunaroja}
      JWT_SECRET: test_secret
      FRONTEND_URL: http://lunaroja_frontend:3000
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
      RATE_LIMIT_MAX: "50000"
      CORS_ORIGINS: http://localhost:3000,http://lunaroja_frontend:3000,http://host.docker.internal:3000
      LOGO_URL: http://localhost:3000/logo.svg
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      - postgres
      - redis
    volumes:
      - uploads_data:/app/uploads
      - ./backend/src:/app/src
    networks:
      - lunaroja_network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:5000}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://backend:5000}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-vocesdepalestina@tutamail.com}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-https://www.instagram.com/stories/voces_palestinas_malaga}
    container_name: lunaroja_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src   # <-- Volumen para desarrollo
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:5000}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://backend:5000}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-vocesdepalestina@tutamail.com}
      NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-https://www.instagram.com/stories/voces_palestinas_malaga}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    networks:
      - lunaroja_network

  metabase:
    image: metabase/metabase:latest
    container_name: lunaroja_metabase
    restart: always
    ports:
      - "3001:3001"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: lunaroja
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_read
      MB_DB_PASS: metabase_read_pw
      MB_DB_HOST: postgres
      MB_JETTY_PORT: 3001
    depends_on:
      - postgres
    volumes:
      - metabase_data:/metabase-data
    networks:
      - lunaroja_network

volumes:
  postgres_data:
    name: lunaroja_postgres_data
  uploads_data:
    name: lunaroja_uploads_data
  metabase_data:
    name: lunaroja_metabase_data

networks:
  lunaroja_network:
    driver: bridge
