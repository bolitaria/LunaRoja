name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  # =====================================================================
  # PRUEBAS UNITARIAS E INTEGRACIÓN (backend + frontend)
  # =====================================================================
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: lunaroja
          POSTGRES_PASSWORD: lunaroja123
          POSTGRES_DB: lunaroja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "No lint script configured"

      - name: Initialize SequelizeMeta table (backend)
        if: matrix.service == 'backend'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=lunaroja123 psql -h localhost -U lunaroja -d lunaroja -c "CREATE TABLE IF NOT EXISTS \"SequelizeMeta\" (name VARCHAR(255) NOT NULL PRIMARY KEY);"

      - name: Run database migrations (backend)
        if: matrix.service == 'backend'
        run: npm run migrate
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret

      - name: Add missing columns (email_template_id, timestamps)
        if: matrix.service == 'backend'
        run: node scripts/add-missing-columns.js
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja

      - name: Create upload directories for backend tests
        if: matrix.service == 'backend'
        run: |
          sudo mkdir -p /app/uploads/petitions /app/uploads/campaigns /app/uploads/actions /app/uploads/documents /app/uploads/featured
          sudo chown -R $(whoami) /app/uploads
          sudo chmod -R 755 /app/uploads

      - name: Test backend (integration)
        if: matrix.service == 'backend'
        run: npm run test:integration
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret
          API_URL: http://localhost:5000
          BASE_URL: http://localhost:5000
          SKIP_DB_SYNC: 'true'
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Test frontend
        if: matrix.service == 'frontend'
        run: npm test

  # =====================================================================
  # PRUEBAS END‑TO‑END CON CYPRESS
  # =====================================================================
  e2e-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: lunaroja
          POSTGRES_PASSWORD: lunaroja123
          POSTGRES_DB: lunaroja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Setup database and start backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: lunaroja
          DB_PASSWORD: lunaroja123
          DB_NAME: lunaroja
          JWT_SECRET: test_secret
          NODE_ENV: test
          SKIP_DB_SYNC: 'true'
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USER -d $DB_NAME -c "CREATE TABLE IF NOT EXISTS \"SequelizeMeta\" (name VARCHAR(255) NOT NULL PRIMARY KEY);"
          cd backend
          npm run migrate
          node scripts/add-missing-columns.js
          sudo mkdir -p /app/uploads/petitions /app/uploads/campaigns /app/uploads/actions /app/uploads/documents /app/uploads/featured
          node src/app.js &
          sleep 5

      - name: Build and start frontend
        run: |
          cd frontend
          npm ci
          npm run build
          npm start &
          sleep 10

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v5
        with:
          working-directory: frontend
          config: baseUrl=http://localhost:3000
        env:
          CYPRESS_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  # =====================================================================
  # CONSTRUCCIÓN Y PUBLICACIÓN DE IMÁGENES DOCKER
  # =====================================================================
  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read        # requerido para actions/checkout
      packages: write       # requerido para publicar en GHCR
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize owner to lowercase
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/lunaroja-${{ matrix.service }}:${{ github.sha }}

  # =====================================================================
  # ESCANEO DE VULNERABILIDADES EN LAS IMÁGENES
  # =====================================================================
  scan-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Normalize owner to lowercase
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Run Trivy on ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/lunaroja-${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
