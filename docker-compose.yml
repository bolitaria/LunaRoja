services:
  postgres:
    image: postgres:14
    container_name: lunaroja_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lunaroja
      POSTGRES_PASSWORD: lunaroja123
      POSTGRES_DB: lunaroja
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunaroja -d lunaroja"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lunaroja_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: lunaroja_pgadmin
    restart: always
    ports:
      - "5050:5050"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lunaroja.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    depends_on:
      - postgres
    networks:
      - lunaroja_network

  backend:
    build: ./backend
    container_name: lunaroja_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: lunaroja
      DB_PASSWORD: lunaroja123
      DB_NAME: lunaroja
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - lunaroja_network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
        NEXT_PUBLIC_BASE_URL: http://localhost:5000
    container_name: lunaroja_frontend
    restart: always
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Opcional, por si se necesita
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_BASE_URL: http://localhost:5000
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    networks:
      - lunaroja_network

  metabase:
    image: metabase/metabase:latest
    container_name: lunaroja_metabase
    restart: always
    ports:
      - "3001:3001"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: lunaroja
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_read
      MB_DB_PASS: metabase_read_pw
      MB_DB_HOST: postgres
      MB_JETTY_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    networks:
      - lunaroja_network

volumes:
  postgres_data:
    name: lunaroja_postgres_data
  uploads_data:
    name: lunaroja_uploads_data
  metabase_data:
    name: lunaroja_metabase_data

networks:
  lunaroja_network:
    driver: bridge