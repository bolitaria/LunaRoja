name: Semgrep Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep (only report, no fail)
        run: |
          docker run -v "${{ github.workspace }}:/src" --rm \
            -e SEMGREP_SEND_METRICS=off \
            semgrep/semgrep:latest \
            semgrep scan \
              --config=p/owasp-top-ten \
              --config=p/dockerfile \
              --config=p/docker-compose \
              --exclude='tests/' \
              /src