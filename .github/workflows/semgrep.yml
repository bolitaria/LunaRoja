name: Semgrep Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.7 (SHA concreto)

      - name: Run Semgrep (local only)
        run: |
          docker run -v "${{ github.workspace }}:/src" --rm \
            -e SEMGREP_SEND_METRICS=off \
            semgrep/semgrep:latest \
            semgrep scan --config=p/owasp-top-ten --config=p/dockerfile --config=p/docker-compose --error /src