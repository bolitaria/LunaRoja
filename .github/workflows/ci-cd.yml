name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [develop, main, 'fix/**']
  pull_request:
    branches: [develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SKIP_DB_SYNC: 'true'
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    strategy:
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Load environment from .env and mask secrets
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          source .env
          set +a
          # Enmascarar valores sensibles
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DB_NAME"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$POSTGRES_USER"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$POSTGRES_DB"
          # Exportar a entorno del job
          echo "DB_USER=$DB_USER" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          echo "DB_NAME=$DB_NAME" >> $GITHUB_ENV
          echo "JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
          echo "POSTGRES_USER=$POSTGRES_USER" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> $GITHUB_ENV
          echo "POSTGRES_DB=$POSTGRES_DB" >> $GITHUB_ENV

      - name: Start services (PostgreSQL + Redis)
        working-directory: ${{ github.workspace }}
        run: |
          docker network create test-net
          docker run -d --name postgres --network test-net \
            -e POSTGRES_USER=$POSTGRES_USER \
            -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            -e POSTGRES_DB=$POSTGRES_DB \
            -p 5432:5432 postgres:14
          docker run -d --name redis --network test-net \
            -p 6379:6379 redis:7-alpine
          # Esperar a que estén sanos
          until docker exec postgres pg_isready -U $POSTGRES_USER; do sleep 2; done
          echo "PostgreSQL ready"
          redis-cli -h localhost ping && echo "Redis ready"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint || echo "No lint script configured"

      # ─── BACKEND SPECIFIC STEPS ───
      - name: Initialize SequelizeMeta table
        if: matrix.service == 'backend'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=$DB_PASSWORD psql -h localhost -U $DB_USER -d $DB_NAME -c "CREATE TABLE IF NOT EXISTS \"SequelizeMeta\" (name VARCHAR(255) NOT NULL PRIMARY KEY);"
      - name: Run database migrations
        if: matrix.service == 'backend'
        run: npm run migrate
      - name: Add missing columns
        if: matrix.service == 'backend'
        run: node scripts/add-missing-columns.js
      - name: Create upload directories
        if: matrix.service == 'backend'
        run: mkdir -p uploads/petitions uploads/campaigns uploads/actions uploads/documents uploads/featured
      - name: Seed admin user
        if: matrix.service == 'backend'
        run: |
          node -e "
          const bcrypt = require('bcryptjs');
          const { User } = require('./src/models');
          (async () => {
            const hash = await bcrypt.hash(process.env.ADMIN_PASSWORD, 10);
            await User.upsert({
              username: 'admin',
              email: 'admin@test.com',
              password: hash,
              role: 'superadmin',
              active: true
            });
            console.log('Admin user seeded');
            process.exit();
          })();
          "
      - name: Start backend server (with health check)
        if: matrix.service == 'backend'
        run: |
          sudo mkdir -p /app/uploads && sudo chmod 777 /app/uploads
          node src/app.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Backend ready"
              break
            fi
            sleep 2
          done
          if ! curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
            echo "❌ Backend no arrancó. Últimas líneas del log:"
            tail -n 50 /tmp/server.log
            exit 1
          fi
      - name: Unlock admin account & run integration tests
        if: matrix.service == 'backend'
        run: |
          node -e "
          const { User } = require('./src/models');
          (async () => {
            await User.update(
              { failedLoginAttempts: 0, lockedUntil: null },
              { where: { username: 'admin' } }
            );
            console.log('Admin unlocked');
            process.exit();
          })();
          "
          npm run test:integration -- --runInBand
        env:
          API_URL: http://localhost:5000
          BASE_URL: http://localhost:5000
      # ─── FRONTEND SPECIFIC STEPS ───
      - name: Run frontend unit tests
        if: matrix.service == 'frontend'
        run: npm test
      - name: Build frontend (compilation check)
        if: matrix.service == 'frontend'
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

  e2e-test:
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SKIP_DB_SYNC: 'true'
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Load environment from .env and mask secrets
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          source .env
          set +a
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DB_NAME"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$POSTGRES_USER"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$POSTGRES_DB"
          echo "DB_USER=$DB_USER" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          echo "DB_NAME=$DB_NAME" >> $GITHUB_ENV
          echo "JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
          echo "POSTGRES_USER=$POSTGRES_USER" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> $GITHUB_ENV
          echo "POSTGRES_DB=$POSTGRES_DB" >> $GITHUB_ENV

      - name: Start services (PostgreSQL + Redis)
        working-directory: ${{ github.workspace }}
        run: |
          docker network create test-net
          docker run -d --name postgres --network test-net \
            -e POSTGRES_USER=$POSTGRES_USER \
            -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            -e POSTGRES_DB=$POSTGRES_DB \
            -p 5432:5432 postgres:14
          docker run -d --name redis --network test-net \
            -p 6379:6379 redis:7-alpine
          until docker exec postgres pg_isready -U $POSTGRES_USER; do sleep 2; done
          echo "PostgreSQL ready"
          redis-cli -h localhost ping && echo "Redis ready"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Setup database, seed admin, start backend
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=$DB_PASSWORD psql -h localhost -U $DB_USER -d $DB_NAME -c "CREATE TABLE IF NOT EXISTS \"SequelizeMeta\" (name VARCHAR(255) NOT NULL PRIMARY KEY);"
          cd backend
          npm run migrate
          node scripts/add-missing-columns.js
          node -e "
          const bcrypt = require('bcryptjs');
          const { User } = require('./src/models');
          (async () => {
            const hash = await bcrypt.hash(process.env.ADMIN_PASSWORD, 10);
            await User.upsert({
              username: 'admin',
              email: 'admin@test.com',
              password: hash,
              role: 'superadmin',
              active: true
            });
            console.log('Admin seeded');
            process.exit();
          })();
          "
          sudo mkdir -p /app/uploads && sudo chmod 777 /app/uploads
          node src/app.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Backend ready"
              break
            fi
            sleep 2
          done
          if ! curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
            echo "❌ Backend no arrancó. Últimas líneas del log:"
            tail -n 50 /tmp/server.log
            exit 1
          fi
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          NEXT_PUBLIC_API_URL=http://localhost:5000 \
          NEXT_PUBLIC_BASE_URL=http://localhost:3000 \
          npm run build
      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
        env:
          CYPRESS_baseUrl: http://localhost:3000
          CYPRESS_admin_username: admin
          CYPRESS_admin_password: ${{ secrets.ADMIN_PASSWORD }}
          NEXT_PUBLIC_API_URL: http://localhost:5000

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize owner and repo to lowercase
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LC=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/${{ env.REPO_LC }}:${{ matrix.service }}-${{ github.sha }}

  scan-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Normalize owner and repo to lowercase
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_LC=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull ${{ matrix.service }} image
        run: docker pull ghcr.io/${{ env.OWNER_LC }}/${{ env.REPO_LC }}:${{ matrix.service }}-${{ github.sha }}
      - name: Run Trivy on ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/${{ env.REPO_LC }}:${{ matrix.service }}-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  playwright-e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      SKIP_DB_SYNC: "true"
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Load environment from .env and mask secrets
        working-directory: ${{ github.workspace }}
        run: |
          set -a
          source .env
          set +a
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DB_NAME"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$POSTGRES_USER"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$POSTGRES_DB"
          echo "DB_USER=$DB_USER" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          echo "DB_NAME=$DB_NAME" >> $GITHUB_ENV
          echo "JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
          echo "POSTGRES_USER=$POSTGRES_USER" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> $GITHUB_ENV
          echo "POSTGRES_DB=$POSTGRES_DB" >> $GITHUB_ENV

      - name: Start services (PostgreSQL + Redis)
        working-directory: ${{ github.workspace }}
        run: |
          docker network create test-net
          docker run -d --name postgres --network test-net \
            -e POSTGRES_USER=$POSTGRES_USER \
            -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            -e POSTGRES_DB=$POSTGRES_DB \
            -p 5432:5432 postgres:14
          docker run -d --name redis --network test-net \
            -p 6379:6379 redis:7-alpine
          until docker exec postgres pg_isready -U $POSTGRES_USER; do sleep 2; done
          echo "PostgreSQL ready"
          redis-cli -h localhost ping && echo "Redis ready"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Initialize SequelizeMeta table
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=$DB_PASSWORD psql -h localhost -U $DB_USER -d $DB_NAME -c "CREATE TABLE IF NOT EXISTS \"SequelizeMeta\" (name VARCHAR(255) NOT NULL PRIMARY KEY);"

      - name: Create BDSs table directly
        run: |
          PGPASSWORD=$DB_PASSWORD psql -h localhost -U $DB_USER -d $DB_NAME -c "CREATE TABLE IF NOT EXISTS \"BDSs\" (id SERIAL PRIMARY KEY, name VARCHAR(255) NOT NULL, description TEXT, color VARCHAR(7) DEFAULT '#E53E3E', \"imageUrl\" VARCHAR(255), groups JSON DEFAULT '[]', \"documentLink\" VARCHAR(255), document VARCHAR(255), \"createdAt\" TIMESTAMP NOT NULL DEFAULT NOW(), \"updatedAt\" TIMESTAMP NOT NULL DEFAULT NOW());"

      - name: Run database migrations
        working-directory: backend
        run: npm run migrate

      - name: Seed admin user
        working-directory: backend
        run: |
          node -e "
          const bcrypt = require('bcryptjs');
          const { User } = require('./src/models');
          (async () => {
            const hash = await bcrypt.hash(process.env.ADMIN_PASSWORD, 10);
            await User.upsert({
              username: 'admin',
              email: 'admin@test.com',
              password: hash,
              role: 'superadmin',
              active: true
            });
            console.log('Admin user seeded');
            process.exit();
          })();
          "

      - name: Start backend server (with health check)
        working-directory: backend
        run: |
          sudo mkdir -p /app/uploads && sudo chmod 777 /app/uploads
          node src/app.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Backend ready"
              break
            fi
            sleep 2
          done
          if ! curl -sSf http://localhost:5000/health > /dev/null 2>&1; then
            echo "❌ Backend no arrancó. Últimas líneas del log:"
            tail -n 50 /tmp/server.log
            exit 1
          fi

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=http://localhost:5000/api \
          NEXT_PUBLIC_BASE_URL=http://localhost:3000 \
          npm run build

      - name: Start frontend server
        working-directory: frontend
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Frontend ready"
              break
            fi
            sleep 2
          done

      - name: Run Playwright tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          TEST_ADMIN_USER: ${{ secrets.TEST_ADMIN_USER }}
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS }}
          BACKEND_URL: http://127.0.0.1:5000
